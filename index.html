<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deep Learning Image Deblurring — Exact PPT Presentation</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #090D16;
      --card-bg: #111827;
      --border: #1F2937;
      --accent: #00E5FF;
      --accent-hover: #38BDF8;
      --text: #F3F4F6;
      --text-muted: #9CA3AF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px 24px;
      user-select: none;
    }

    /* Top Bar */
    header {
      width: 100%;
      max-width: 1280px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 18px;
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 12px;
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .badge-icon {
      background: linear-gradient(135deg, #00E5FF, #3B82F6);
      color: #090D16;
      font-weight: 800;
      font-size: 13px;
      padding: 4px 8px;
      border-radius: 6px;
      letter-spacing: 0.05em;
    }

    .file-name {
      font-size: 14px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: -0.01em;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .counter-pill {
      background: rgba(0, 229, 255, 0.1);
      border: 1px solid rgba(0, 229, 255, 0.3);
      color: var(--accent);
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 999px;
    }

    .btn-top {
      background: #1F2937;
      border: 1px solid #374151;
      color: var(--text);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn-top:hover {
      background: #374151;
      color: var(--accent);
      border-color: var(--accent);
    }

    /* Main Presentation Slide Viewport */
    .deck-container {
      width: 100%;
      max-width: 1280px;
      aspect-ratio: 16 / 9;
      background: #000;
      border: 1px solid var(--border);
      border-radius: 16px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8), 0 0 40px rgba(0, 229, 255, 0.08);
    }

    .slide-wrapper {
      width: 100%;
      height: 100%;
      position: relative;
    }

    .slide-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0;
      transition: opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1), transform 0.25s ease;
      pointer-events: none;
    }

    .slide-img.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Floating Arrow Direction Buttons */
    .side-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(17, 24, 39, 0.7);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #FFFFFF;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 10;
      outline: none;
    }

    .side-arrow:hover:not(:disabled) {
      background: var(--accent);
      color: #090D16;
      border-color: var(--accent);
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.6);
      transform: translateY(-50%) scale(1.08);
    }

    .side-arrow:disabled {
      opacity: 0.15;
      cursor: not-allowed;
    }

    .side-arrow.prev {
      left: 18px;
    }

    .side-arrow.next {
      right: 18px;
    }

    /* Bottom Control Bar */
    .controls-bar {
      width: 100%;
      max-width: 1280px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 14px;
      padding: 0 6px;
    }

    .btn-nav {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 22px;
      border-radius: 10px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-nav:hover:not(:disabled) {
      background: #1F2937;
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.25);
      transform: translateY(-1px);
    }

    .btn-nav:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* Thumbnail / Dots Navigator */
    .dots-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #1F2937;
      border: 1px solid #374151;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .dot:hover {
      background: var(--accent-hover);
      transform: scale(1.2);
    }

    .dot.active {
      width: 34px;
      border-radius: 6px;
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
    }

    /* Fullscreen Mode */
    :fullscreen .deck-container {
      max-width: 100vw;
      width: 100vw;
      height: 100vh;
      border-radius: 0;
      border: none;
    }

    :fullscreen body {
      padding: 0;
      justify-content: center;
    }

    :fullscreen header,
    :fullscreen .controls-bar {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="title-group">
      <span class="badge-icon">PPTX</span>
      <span class="file-name">Deep_Learning_Image_Deblurring_Seminar.pptx</span>
    </div>

    <div class="header-actions">
      <div class="counter-pill" id="counterDisplay">Slide 1 of 6</div>
      <button class="btn-top" id="btnFullscreen" title="Toggle Fullscreen (F)">
        <span>⛶</span> Fullscreen
      </button>
      <a class="btn-top" href="Deep_Learning_Image_Deblurring_Seminar.pptx" download title="Download Original PowerPoint Presentation">
        <span>📥</span> Download PPT
      </a>
    </div>
  </header>

  <!-- Slide Deck Container -->
  <main class="deck-container" id="deckContainer">
    <!-- Left Previous Floating Button -->
    <button class="side-arrow prev" id="arrowPrev" title="Previous Slide (Left Arrow)">◀</button>

    <!-- Slide Images (Exact 1920x1080 High-Res PowerPoint Exports) -->
    <div class="slide-wrapper" id="slideWrapper">
      <img src="slides/slide_1.png" class="slide-img active" alt="Slide 1" id="slide-1">
      <img src="slides/slide_2.png" class="slide-img" alt="Slide 2" id="slide-2">
      <img src="slides/slide_3.png" class="slide-img" alt="Slide 3" id="slide-3">
      <img src="slides/slide_4.png" class="slide-img" alt="Slide 4" id="slide-4">
      <img src="slides/slide_5.png" class="slide-img" alt="Slide 5" id="slide-5">
      <img src="slides/slide_6.png" class="slide-img" alt="Slide 6" id="slide-6">
    </div>

    <!-- Right Next Floating Button -->
    <button class="side-arrow next" id="arrowNext" title="Next Slide (Right Arrow / Space)">▶</button>
  </main>

  <!-- Bottom Navigation Direction Controls -->
  <footer class="controls-bar">
    <button class="btn-nav" id="btnPrev">
      <span>◀</span> Previous
    </button>

    <!-- Indicator Dots -->
    <div class="dots-container" id="dotsContainer">
      <div class="dot active" onclick="goToSlide(1)" title="Slide 1"></div>
      <div class="dot" onclick="goToSlide(2)" title="Slide 2"></div>
      <div class="dot" onclick="goToSlide(3)" title="Slide 3"></div>
      <div class="dot" onclick="goToSlide(4)" title="Slide 4"></div>
      <div class="dot" onclick="goToSlide(5)" title="Slide 5"></div>
      <div class="dot" onclick="goToSlide(6)" title="Slide 6"></div>
    </div>

    <button class="btn-nav" id="btnNext">
      Next <span>▶</span>
    </button>
  </footer>

  <script>
    const totalSlides = 6;
    let currentSlide = 1;

    // Elements
    const slideImages = document.querySelectorAll('.slide-img');
    const dots = document.querySelectorAll('.dot');
    const counterDisplay = document.getElementById('counterDisplay');
    const btnPrev = document.getElementById('btnPrev');
    const btnNext = document.getElementById('btnNext');
    const arrowPrev = document.getElementById('arrowPrev');
    const arrowNext = document.getElementById('arrowNext');
    const btnFullscreen = document.getElementById('btnFullscreen');
    const deckContainer = document.getElementById('deckContainer');

    function updateSlideView() {
      // Toggle slide visibility
      slideImages.forEach((img, idx) => {
        img.classList.toggle('active', idx + 1 === currentSlide);
      });

      // Update dots
      dots.forEach((dot, idx) => {
        dot.classList.toggle('active', idx + 1 === currentSlide);
      });

      // Update counter text
      counterDisplay.textContent = `Slide ${currentSlide} of ${totalSlides}`;

      // Update button disabled states
      btnPrev.disabled = currentSlide === 1;
      arrowPrev.disabled = currentSlide === 1;

      btnNext.disabled = currentSlide === totalSlides;
      arrowNext.disabled = currentSlide === totalSlides;
    }

    function goToSlide(num) {
      if (num < 1 || num > totalSlides) return;
      currentSlide = num;
      updateSlideView();
    }

    function nextSlide() {
      if (currentSlide < totalSlides) {
        goToSlide(currentSlide + 1);
      }
    }

    function prevSlide() {
      if (currentSlide > 1) {
        goToSlide(currentSlide - 1);
      }
    }

    // Button event listeners
    btnNext.addEventListener('click', nextSlide);
    arrowNext.addEventListener('click', nextSlide);
    btnPrev.addEventListener('click', prevSlide);
    arrowPrev.addEventListener('click', prevSlide);

    // Keyboard Arrow Direction Navigation
    window.addEventListener('keydown', (e) => {
      switch (e.key) {
        case 'ArrowRight':
        case 'ArrowDown':
        case 'PageDown':
        case ' ':
          e.preventDefault();
          nextSlide();
          break;
        case 'ArrowLeft':
        case 'ArrowUp':
        case 'PageUp':
          e.preventDefault();
          prevSlide();
          break;
        case 'Home':
          e.preventDefault();
          goToSlide(1);
          break;
        case 'End':
          e.preventDefault();
          goToSlide(totalSlides);
          break;
        case 'f':
        case 'F':
          e.preventDefault();
          toggleFullscreen();
          break;
      }
    });

    // Fullscreen Toggle
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        deckContainer.requestFullscreen().catch(err => {
          console.warn('Fullscreen error:', err);
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }
    btnFullscreen.addEventListener('click', toggleFullscreen);

    // Touch Swipe for Mobile & Tablet
    let touchStartX = 0;
    let touchEndX = 0;

    deckContainer.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    deckContainer.addEventListener('touchend', (e) => {
      touchEndX = e.changedTouches[0].screenX;
      if (touchEndX < touchStartX - 50) {
        nextSlide(); // Swipe left -> Next
      } else if (touchEndX > touchStartX + 50) {
        prevSlide(); // Swipe right -> Prev
      }
    }, { passive: true });

    // Initial setup
    updateSlideView();
  </script>
</body>
</html>
